<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#2E9BE0" />
  <title data-i18n="meta.title">تسجيل الدخول | MedSky Training Academy</title>
  <meta name="description" content="سجّل الدخول إلى حسابك في أكاديمية ميدسكاي لمتابعة رحلتك في الترجمة الطبية." />
  <link rel="canonical" href="https://medskyacademy.com/auth.html" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/0786dcbd-1d22-422b-9182-5fd58fbbd30f.png" type="image/png" />
</head>
<body class="auth-body">

  <div class="site-loader" id="siteLoader" aria-hidden="true">
    <div class="loader-logo-wrap">
      <img src="images/0786dcbd-1d22-422b-9182-5fd58fbbd30f.png" alt="MedSky" class="loader-logo" />
    </div>
  </div>

  <!-- ===================== Floating Navbar ===================== -->
  <header class="msn" id="navbar">
    <div class="msn-bar">

      <a href="index.html" class="msn-logo" aria-label="ميدسكاي">
        <img src="images/0786dcbd-1d22-422b-9182-5fd58fbbd30f.png" alt="MedSky Training Academy" />
      </a>

      <nav class="msn-links" aria-label="Main">
        <a href="index.html#hero" class="msn-link" data-i18n="nav.home">الرئيسية</a>
        <a href="index.html#courses" class="msn-link" data-i18n="nav.courses">الدورات</a>
        <a href="index.html#programs" class="msn-link" data-i18n="nav.programs">نحو الاحتراف</a>
        <a href="index.html#trainers" class="msn-link" data-i18n="nav.trainers">المدربون</a>
        <a href="https://wa.me/201505628143" target="_blank" rel="noopener" class="msn-link" data-i18n="nav.contact">تواصل معنا</a>
      </nav>

      <div class="msn-tools">

        <div class="msn-lang" id="langDD">
          <button type="button" class="msn-icon" id="langToggle" aria-haspopup="menu" aria-expanded="false" aria-label="اختر اللغة" data-i18n-aria="aria.chooseLang">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19"/><path d="M12 2.5c2.6 2.6 4 5.9 4 9.5s-1.4 6.9-4 9.5c-2.6-2.6-4-5.9-4-9.5s1.4-6.9 4-9.5z"/></svg>
          </button>
          <div class="msn-menu" id="langMenu" role="menu">
            <button type="button" class="active" data-lang="ar" role="menuitem">العربية</button>
            <button type="button" data-lang="en" role="menuitem">English</button>
          </div>
        </div>

        <button type="button" class="msn-icon" id="themeToggle" aria-label="اختر المظهر" data-i18n-aria="aria.chooseTheme">
          <span class="msn-swap" aria-hidden="true">
            <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </span>
        </button>

        <span class="msn-sep" aria-hidden="true"></span>

        <a href="auth.html" class="msn-login">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span data-i18n="mobile.login">تسجيل الدخول</span>
        </a>

      </div>

      <button type="button" class="msn-burger" id="hamburger" aria-label="فتح القائمة" data-i18n-aria="aria.openMenu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ===================== Mobile Sheet ===================== -->
  <div class="msn-sheet" id="mobileMenu" role="dialog" aria-modal="true">
    <div class="msn-backdrop" data-close></div>
    <div class="msn-panel">

      <div class="msn-panel-head">
        <a href="index.html" class="msn-logo" data-close aria-label="ميدسكاي" style="margin:0;">
          <img src="images/0786dcbd-1d22-422b-9182-5fd58fbbd30f.png" alt="MedSky Training Academy" />
        </a>
        <button type="button" class="msn-close" id="mobileClose" aria-label="إغلاق القائمة" data-i18n-aria="aria.closeMenu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="msn-mlinks">
        <a href="index.html#hero" class="msn-mlink" data-close data-i18n="nav.home">الرئيسية</a>
        <a href="index.html#courses" class="msn-mlink" data-close data-i18n="nav.courses">الدورات</a>
        <a href="index.html#programs" class="msn-mlink" data-close data-i18n="nav.programsShort">البرامج</a>
        <a href="index.html#trainers" class="msn-mlink" data-close data-i18n="nav.trainers">المدربون</a>
        <a href="https://wa.me/201505628143" target="_blank" rel="noopener" class="msn-mlink" data-close data-i18n="nav.contact">تواصل معنا</a>
      </div>

      <div class="msn-mrow">
        <span data-i18n="mobile.language">اللغة</span>
        <div class="msn-seg">
          <button type="button" class="active" data-lang="ar">العربية</button>
          <button type="button" data-lang="en">English</button>
        </div>
      </div>

      <button type="button" class="msn-mrow" id="mobileThemeToggle">
        <span data-i18n="mobile.appearance">المظهر</span>
        <span class="msn-row-end">
          <span id="mobileThemeValue">فاتح</span>
          <span class="msn-swap" aria-hidden="true">
            <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </span>
        </span>
      </button>

      <div class="msn-mactions">
        <a href="auth.html?mode=register" class="msn-cta" data-close data-i18n="nav.signup">ابدأ مجاناً</a>
      </div>
    </div>
  </div>

  <main class="auth-main">
    <div class="auth-bg" aria-hidden="true">
      <div class="hero-glow"></div>
      <div class="hero-orb orb-a"></div>
      <div class="hero-orb orb-b"></div>
      <div class="auth-grid"></div>
    </div>

    <div class="auth-shell">

      <section class="auth-card-wrap reveal-up">
        <div class="auth-card">

          <div class="auth-brand-mark">
            <div class="auth-brand-icon"><i class="fa-solid fa-user-lock"></i></div>
          </div>

          <form class="auth-form active" id="loginForm" novalidate>
            <div class="auth-form-head">
              <h2 data-i18n="login.title">مرحباً بعودتك</h2>
              <p data-i18n="login.subtitle">سجل الدخول لمتابعة رحلتك التعليمية</p>
            </div>

            <div class="auth-field">
              <label for="loginEmail" data-i18n="login.email">البريد الإلكتروني</label>
              <div class="auth-input-wrap">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="loginEmail" name="email" autocomplete="email" required dir="ltr" data-i18n-placeholder="login.emailPlaceholder" placeholder="you@example.com" />
              </div>
              <span class="auth-field-error" data-error-for="loginEmail"></span>
            </div>

            <div class="auth-field">
              <label for="loginPassword" data-i18n="login.password">كلمة المرور</label>
              <div class="auth-input-wrap">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPassword" name="password" autocomplete="current-password" required minlength="8" data-i18n-placeholder="login.passwordPlaceholder" placeholder="••••••••" />
                <button type="button" class="auth-eye-toggle" data-toggle-for="loginPassword" data-i18n-aria="aria.showPassword" aria-label="إظهار كلمة المرور">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
              <span class="auth-field-error" data-error-for="loginPassword"></span>
            </div>

            <div class="auth-row-between">
              <label class="auth-checkbox">
                <input type="checkbox" id="rememberMe" />
                <span class="auth-checkbox-box"><i class="fa-solid fa-check"></i></span>
                <span data-i18n="login.remember">تذكرني</span>
              </label>
              <a href="#" class="auth-link-muted" id="forgotPasswordLink" data-i18n="login.forgotPassword">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="btn-primary btn-lg btn-ripple auth-submit">
              <span data-i18n="login.button">تسجيل الدخول</span>
              <i class="fa-solid fa-arrow-left" id="loginSubmitIcon"></i>
            </button>

            <div class="auth-divider"><span data-i18n="login.continueWith">أو تابع عبر</span></div>

            <div class="auth-social">
              <button type="button" class="auth-social-btn" id="googleLoginBtn" data-provider="google">
                <i class="fa-brands fa-google"></i>
                <span data-i18n="login.google">جوجل</span>
              </button>
              <button type="button" class="auth-social-btn" >
                <i class="fa-brands fa-linkedin"></i> <span data-i18n="login.linkedin">لينكدإن</span>
              </button>
            </div>

            <p class="auth-switch-text">
              <span data-i18n="login.needHelp">تحتاج مساعدة؟</span>
              <a href="https://wa.me/201505628143" target="_blank" rel="noopener" class="auth-switch-btn" data-i18n="nav.contact">تواصل معنا</a>
            </p>
          </form>

        </div>
      </section>

    </div>
  </main>

  <div class="auth-toast" id="authToast" role="status" aria-live="polite">
    <i class="fa-solid fa-circle-check"></i>
    <span id="authToastText"></span>
  </div>

  <div class="auth-modal-overlay" id="successModalOverlay" role="dialog" aria-modal="true" aria-labelledby="successModalTitle">
    <div class="auth-modal" id="successModal">
      <div class="auth-modal-icon"><i class="fa-solid fa-circle-check"></i></div>
      <h3 id="successModalTitle" data-i18n="modal.successTitle">تم تسجيل الدخول بنجاح</h3>
      <p data-i18n="modal.successMessage">جاري تحويلك إلى الصفحة الرئيسية...</p>
      <div class="auth-modal-spinner"></div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="javascript/auth.js"></script>

</body>
</html>
